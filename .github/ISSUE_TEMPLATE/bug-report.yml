name: Bug report
description: Report a bug in the Bond desktop application.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please
        check the [existing issues](https://github.com/LaGuardAI/bond-releases/issues)
        to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Bond version
      description: From the desktop app's About menu (e.g. 1.4.5-alpha.1).
      placeholder: "1.4.5-alpha.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Sonoma / 14.x)
        - macOS (Ventura / 13.x)
        - macOS (older)
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Short, factual description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Be specific.
      placeholder: |
        1. Open Bond
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Attach any relevant logs or screenshots. **Do not include API keys,
        redemption codes, or other secrets.**
